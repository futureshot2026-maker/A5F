<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">شعار أكاديمية المستقبل لتدريب الكوافير وأدوات التجميل</title>
  <defs>
    <radialGradient id="wineGrad" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#8C3057"/>
      <stop offset="100%" stop-color="#4A1229"/>
    </radialGradient>
  </defs>

  <!-- الخلفية الدائرية -->
  <circle cx="120" cy="120" r="116" fill="url(#wineGrad)"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="#D9A657" stroke-width="2" opacity="0.6"/>

  <!-- نجمة التألق (بريق الجمال والمستقبل) -->
  <path d="M120,26 L124,36 L134,40 L124,44 L120,54 L116,44 L106,40 L116,36 Z" fill="#E9B96C"/>

  <!-- بريق زخرفي صغير على الجانبين -->
  <g fill="#E9B96C">
    <path d="M52,150 L54.5,156 L60,158 L54.5,160 L52,166 L49.5,160 L44,158 L49.5,156 Z"/>
    <circle cx="66" cy="132" r="3"/>
    <path d="M188,150 L190.5,156 L196,158 L190.5,160 L188,166 L185.5,160 L180,158 L185.5,156 Z"/>
    <circle cx="174" cy="132" r="3"/>
  </g>

  <!-- مقص الكوافير -->
  <g fill="none" stroke="#E9B96C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,62 L120,130 L158,194"/>
    <path d="M160,62 L120,130 L82,194"/>
  </g>
  <g fill="none" stroke="#E9B96C" stroke-width="7">
    <circle cx="158" cy="194" r="16"/>
    <circle cx="82" cy="194" r="16"/>
  </g>
  <circle cx="120" cy="130" r="5.5" fill="#E9B96C"/>
</svg>
