<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A5F — Files & Documents</title>
<link rel="icon" href="/assets/favicon-32.png">
<style>
:root{--ink:#17191d;--muted:#707784;--line:#e5e7eb;--bg:#f5f6f8;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.14em}.back{color:var(--ink);text-decoration:none;font-weight:750}
.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.04)}.hero{padding:28px;margin-top:20px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted)}h1{font-size:42px;margin:8px 0}.muted{color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer}
.primary{background:var(--ink);color:#fff}.secondary{background:#eceff2;color:var(--ink)}
select,input{border:1px solid #dfe3e8;border-radius:10px;padding:10px;font:inherit;background:#fff}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:16px}.card{padding:22px}.card h2{margin:0 0 16px}
.file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid #eceef1}.file:last-child{border:0}
.name{font-weight:800;overflow-wrap:anywhere;word-break:break-word}.meta{font-size:12px;color:#7a808a;margin-top:4px}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef1f4;font-size:11px;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:#7a808a}
@media(max-width:800px){.grid{grid-template-columns:1fr}.file{grid-template-columns:minmax(0,1fr)}h1{font-size:32px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">A5F</div><div class="actions"><a class="back" href="/project/">← Project Workspace</a><a class="back" href="/client/">Client Portal</a></div></header>
<section class="hero"><div class="eyebrow">A5F / FILES & DOCUMENTS</div>
<h1 id="project">Project Files</h1><p class="muted">One place for project documents, references and deliverables.</p>
<div class="toolbar"><select id="category"><option>Blueprint</option><option>Proposal</option><option>Contract</option><option>Design</option><option>Deliverable</option><option>Other</option></select>
<input id="fileInput" type="file" multiple><button class="btn primary" id="upload">Add selected files</button></div></section>
<section class="grid"><div class="card"><h2>All files <span class="tag" id="count">0</span></h2><div id="list"></div></div>
<div><div class="card"><h2>Recent files</h2><div id="recent"></div></div><div class="card"><h2>Categories</h2><div id="categories"></div></div></div></section>
</main>
<script>
(()=>{const KEY='a5f-project-files', $=id=>document.getElementById(id);
let files=JSON.parse(localStorage.getItem(KEY)||'[]');
const leads=JSON.parse(localStorage.getItem('a5f-leads')||'[]'), id=localStorage.getItem('a5f-proposal-lead'), lead=leads.find(x=>x.id===id);
$('project').textContent=(lead&&lead.project?lead.project:'Project')+' — Files';
const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
function persist(){localStorage.setItem(KEY,JSON.stringify(files));render()}
function render(){
 $('count').textContent=files.length;
 $('list').innerHTML=files.length?files.map((f,i)=>`<div class="file"><div><div class="name">${esc(f.name)}</div><div class="meta">${esc(f.category)} · ${size(f.size)} · ${new Date(f.date).toLocaleString()}</div></div><div class="actions"><button class="btn secondary" data-open="${i}">Open</button><button class="btn secondary" data-delete="${i}">Delete</button></div></div>`).join(''):'<div class="empty">No project files yet.</div>';
 $('recent').innerHTML=files.slice().sort((a,b)=>b.date-a.date).slice(0,5).map(f=>`<div class="meta" style="padding:7px 0"><b>${esc(f.name)}</b><br>${esc(f.category)}</div>`).join('')||'<div class="empty">No recent files.</div>';
 const cats={};files.forEach(f=>cats[f.category]=(cats[f.category]||0)+1);
 $('categories').innerHTML=Object.entries(cats).map(([k,v])=>`<div style="padding:7px 0"><b>${esc(k)}</b> <span class="tag">${v}</span></div>`).join('')||'<div class="empty">No categories yet.</div>';
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.delete,1);persist()});
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const f=files[+b.dataset.open]; if(!f.data)return; const a=document.createElement('a');a.href=f.data;a.download=f.name;a.target='_blank';a.click()});
}
$('upload').onclick=()=>{const input=$('fileInput'),category=$('category').value;if(!input.files.length)return;
 [...input.files].forEach(file=>{const reader=new FileReader();reader.onload=()=>{files.unshift({name:file.name,size:file.size,type:file.type,category,date:Date.now(),data:reader.result});persist()};reader.readAsDataURL(file)});
 input.value=''};
render();
})()
</script></body></html>
