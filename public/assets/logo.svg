<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">أكاديمية المستقبل</title>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C08A"/>
      <stop offset="50%" stop-color="#C9A05A"/>
      <stop offset="100%" stop-color="#9C7A3E"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B2B"/>
      <stop offset="100%" stop-color="#150F19"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="110" r="106" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Scissors + bloom monogram -->
  <g transform="translate(110,112)">
    <!-- flower / bloom above -->
    <g fill="url(#goldGrad)">
      <ellipse cx="0" cy="-46" rx="7" ry="14" transform="rotate(0)"/>
      <ellipse cx="0" cy="-46" rx="7" ry="14" transform="rotate(60)"/>
      <ellipse cx="0" cy="-46" rx="7" ry="14" transform="rotate(120)"/>
      <ellipse cx="0" cy="-46" rx="7" ry="14" transform="rotate(180)"/>
      <ellipse cx="0" cy="-46" rx="7" ry="14" transform="rotate(240)"/>
      <ellipse cx="0" cy="-46" rx="7" ry="14" transform="rotate(300)"/>
      <circle cx="0" cy="-46" r="6" fill="#150F19"/>
    </g>

    <!-- scissors -->
    <g stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="-30" y1="-6" x2="26" y2="34"/>
      <line x1="30" y1="-6" x2="-26" y2="34"/>
      <circle cx="-34" cy="-9" r="9" fill="none"/>
      <circle cx="34" cy="-9" r="9" fill="none"/>
      <path d="M -6 14 L 34 14" stroke-width="4"/>
    </g>
  </g>

  <text x="110" y="182" text-anchor="middle" font-family="Tajawal, 'Segoe UI', sans-serif" font-size="17" fill="url(#goldGrad)" font-weight="700">أكاديمية المستقبل</text>
  <text x="110" y="199" text-anchor="middle" font-family="Tajawal, 'Segoe UI', sans-serif" font-size="8.5" letter-spacing="3" fill="#C9A05A" opacity="0.85">FUTURE ACADEMY</text>
</svg>
