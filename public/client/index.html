<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A5F — Portal del Cliente 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17191d;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px 20px 60px}.top{display:flex;justify-content:space-between;gap:15px}.brand{font-weight:900;letter-spacing:.14em}.back{color:#17191d;text-decoration:none;font-weight:800}.hero,.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.04)}.hero{padding:27px;margin-top:20px}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:850;color:#737984}h1{font-size:40px;margin:8px 0}.muted{color:#737984}.status,.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef1f4;font-size:11px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{border:1px solid #e8eaed;border-radius:14px;padding:15px}.stat b{display:block;font-size:23px}.progress{height:9px;background:#eceef1;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;background:#17191d;width:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab,.btn{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.tab{background:#e9edf0}.tab.active,.primary{background:#17191d;color:#fff}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.card{padding:22px}.card h2{margin-top:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eceef1}.row:last-child{border:0}.event,.file{padding:11px 0;border-bottom:1px solid #eceef1}.event:last-child,.file:last-child{border:0}.event small{display:block;color:#7a808a;margin-top:4px}.btn{background:#eceff2;color:#17191d;margin:3px}textarea{width:100%;min-height:95px;border:1px solid #dfe3e8;border-radius:11px;padding:11px;font:inherit}.empty{padding:25px;text-align:center;color:#7a808a}.done{text-decoration:line-through;color:#777d86}@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}h1{font-size:32px}}@media(max-width:520px){.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">A5F</div><a class="back" href="/project/">← Espacio de Proyecto</a></header>
<section class="hero"><div class="eyebrow">A5F / PORTAL DEL CLIENTE 2.0</div><h1 id="project">Mi Proyecto</h1><p class="muted" id="client">Espacio de trabajo del cliente</p><span class="status" id="status">PLANIFICACIÓN</span><div class="stats"><div class="stat"><b id="pct">0%</b><span class="muted">Progreso</span></div><div class="stat"><b id="tasks">0/0</b><span class="muted">Tareas</span></div><div class="stat"><b id="miles">0</b><span class="muted">Hitos</span></div><div class="stat"><b id="files">0</b><span class="muted">Archivos</span></div></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<nav class="tabs"><button class="tab active" data-tab="overview">Resumen</button><button class="tab" data-tab="tasks">Tareas</button><button class="tab" data-tab="files">Archivos</button><button class="tab" data-tab="approvals">Aprobaciones</button><button class="tab" data-tab="messages">Mensajes</button><button class="tab" data-tab="activity">Actividad</button></nav><section id="content"></section>
<script>
(()=>{const $=x=>document.getElementById(x),key='a5f-client-portal-v21',leads=JSON.parse(localStorage.getItem('a5f-leads')||'[]'),lead=leads.find(x=>x.id===localStorage.getItem('a5f-proposal-lead'));let p=JSON.parse(localStorage.getItem('a5f-project-workspace')||'null')||{name:lead?.project||'Proyecto A5F',status:'PLANIFICACIÓN',tasks:[],milestones:[],events:[]};let files=JSON.parse(localStorage.getItem('a5f-project-files')||'[]'),portal=JSON.parse(localStorage.getItem(key)||'null')||{messages:[],approvals:[{title:'Propuesta de proyecto',status:'Pendiente',at:new Date().toLocaleString()}]};p.tasks=p.tasks||[];p.milestones=p.milestones||[];p.events=p.events||[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const save=()=>localStorage.setItem(key,JSON.stringify(portal));const pct=()=>p.tasks.length?Math.round(p.tasks.filter(x=>x.done).length/p.tasks.length*100):0;
function head(){$('project').textContent=p.name||'Proyecto A5F';$('client').textContent=lead?.company||lead?.email||'Espacio de trabajo del cliente';$('status').textContent=p.status||'PLANIFICACIÓN';$('pct').textContent=pct()+'%';$('tasks').textContent=p.tasks.filter(x=>x.done).length+'/'+p.tasks.length;$('miles').textContent=p.milestones.length;$('files').textContent=files.length;$('bar').style.width=pct()+'%'}
function overview(){return '<div class="grid"><div class="card"><h2>Resumen del proyecto</h2><p class="muted">Progreso, hitos y estado actual.</p>'+(p.milestones.length?p.milestones.map(m=>'<div class="row"><div><b>'+esc(m.name)+'</b><div class="muted">'+esc(m.due||'Sin fecha límite')+'</div></div><span class="tag">Hito</span></div>').join(''):'<div class="empty">Todavía no hay hitos publicados.</div>')+'</div><div class="card"><h2>Siguientes pasos</h2><p class="muted">Revisa tareas y aprobaciones, o escribe al equipo de A5F.</p><button class="btn primary" onclick="show(\'approvals\')">Revisar aprobaciones</button></div></div>'}
function tasks(){return '<div class="card"><h2>Tareas</h2>'+(p.tasks.length?p.tasks.map(t=>'<div class="row"><div><b class="'+(t.done?'done':'')+'">'+esc(t.title)+'</b>'+(t.assignee?'<div class="muted">Asignado a '+esc(t.assignee)+'</div>':'')+'</div><span class="tag">'+(t.done?'Hecho':'Abierto')+'</span></div>').join(''):'<div class="empty">Todavía no hay tareas.</div>')+'</div>'}
function fileview(){return '<div class="card"><h2>Archivos del proyecto</h2>'+(files.length?files.map((f,i)=>'<div class="file"><b>'+esc(f.name)+'</b><div class="muted">'+esc(f.category)+' · '+new Date(f.date).toLocaleString()+'</div><button class="btn" onclick="openFile('+i+')">Abrir</button></div>').join(''):'<div class="empty">Todavía no hay archivos publicados.</div>')+'</div>'}
function approvals(){return '<div class="card"><h2>Aprobaciones</h2><p class="muted">Aprueba un elemento o solicita cambios.</p>'+(portal.approvals.length?portal.approvals.map((a,i)=>'<div class="row"><div><b>'+esc(a.title)+'</b><div class="muted">'+esc(a.status)+' · '+esc(a.at)+'</div></div>'+(a.status==='Pendiente'?'<div><button class="btn primary" onclick="approve('+i+')">Aprobar</button><button class="btn" onclick="changes('+i+')">Solicitar cambios</button></div>':'').trim()+'</div>').join(''):'<div class="empty">No hay aprobaciones pendientes.</div>')+'</div>'}
function messages(){return '<div class="card"><h2>Mensajes</h2>'+portal.messages.map(m=>'<div class="event"><b>'+esc(m.text)+'</b><small>'+esc(m.at)+'</small></div>').join('')+'<textarea id="msg" placeholder="Escribe un mensaje al equipo de A5F…"></textarea><button class="btn primary" onclick="send()">Enviar mensaje</button></div>'}
function activity(){let e=p.events.concat(portal.messages.map(m=>({text:'Mensaje del cliente: '+m.text,at:m.at})));return '<div class="card"><h2>Actividad</h2>'+(e.length?e.slice().reverse().map(x=>'<div class="event"><b>'+esc(x.text)+'</b><small>'+esc(x.at)+'</small></div>').join(''):'<div class="empty">Todavía no hay actividad.</div>')+'</div>'}
window.show=t=>{document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('content').innerHTML=({overview,tasks,files:fileview,approvals,messages,activity}[t]||overview)();head()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
window.send=()=>{let x=$('msg').value.trim();if(!x)return;portal.messages.push({text:x,at:new Date().toLocaleString()});save();show('messages')};window.approve=i=>{portal.approvals[i].status='Aprobado';portal.approvals[i].at=new Date().toLocaleString();save();show('approvals')};window.changes=i=>{portal.approvals[i].status='Cambios solicitados';portal.approvals[i].at=new Date().toLocaleString();save();show('approvals')};window.openFile=i=>{let f=files[i];if(f?.data){let a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}else alert('Los datos del archivo no están disponibles para este elemento.');};show('overview')})()
</script></main></body></html>
